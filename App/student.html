<!DOCTYPE html>
<html>

<head>

<title>Online Test</title>

<link rel="stylesheet" href="student.css">

</head>


<body>


<div class="exam-container">


<h1>
Online Test Series
</h1>


<div id="testSelection">


<h2>Select Test</h2>


<select id="studentTestSelect"></select>


<button onclick="startTest()">
Start Test
</button>


</div>





<div id="examBox" style="display:none">


<div class="topbar">


<h3 id="testTitle"></h3>


<div>
Time:
<span id="timer">
00:00
</span>
</div>


</div>





<div class="progress">

Question
<span id="currentNo">
1
</span>
/
<span id="totalNo">
0
</span>


</div>




<div id="questionBox">


</div>





<div class="buttons">


<button onclick="previousQuestion()">
Previous
</button>


<button onclick="nextQuestion()">
Next
</button>


<button 
class="submit"
onclick="submitTest()">

Submit Test

</button>


</div>



</div>






<div id="resultBox"
style="display:none">


<h2>
Result
</h2>


<h1 id="score"></h1>


<div id="review"></div>


</div>




</div>



<script src="student.js"></script>


</body>

</html>
