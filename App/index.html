<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Series Manager</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

<h2>📚 Test Admin</h2>


<button onclick="showSection('dashboard')">
Dashboard
</button>


<button onclick="showSection('subjects')">
Subjects
</button>


<button onclick="showSection('topics')">
Topics
</button>


<button onclick="showSection('modules')">
Modules
</button>


<button onclick="showSection('tests')">
Tests
</button>


<button onclick="showSection('mcqs')">
MCQ Bank
</button>


<hr>


<button onclick="exportData()">
⬇ Backup
</button>


<button onclick="importData()">
⬆ Restore
</button>


<input 
type="file"
id="importFile"
hidden>


</aside>




<!-- MAIN CONTENT -->


<main class="content">


<header>

<h1>
Online Test Series Manager
</h1>


<input 
id="searchBox"
placeholder="Search..."
onkeyup="searchData()">

</header>





<!-- DASHBOARD -->


<section id="dashboard"
class="section active">


<h2>
Dashboard
</h2>


<div class="stats">


<div class="box">

<h3 id="totalSubjects">
0
</h3>

<p>
Subjects
</p>

</div>



<div class="box">

<h3 id="totalTests">
0
</h3>

<p>
Tests
</p>

</div>




<div class="box">

<h3 id="totalMCQ">
0
</h3>

<p>
Questions
</p>

</div>


</div>



<div id="dashboardData"></div>


</section>





<!-- SUBJECT -->

<section id="subjects"
class="section">


<h2>
Manage Subjects
</h2>


<div class="form">


<input
id="subjectInput"
placeholder="Enter subject name">


<button onclick="saveSubject()">
Save Subject
</button>


</div>


<div id="subjectList"></div>


</section>







<!-- TOPIC -->


<section id="topics"
class="section">


<h2>
Manage Topics
</h2>


<div class="form">


<select id="topicSubjectSelect"></select>


<input
id="topicInput"
placeholder="Topic name">


<button onclick="saveTopic()">
Save Topic
</button>


</div>



<div id="topicList"></div>


</section>








<!-- MODULE -->


<section id="modules"
class="section">


<h2>
Manage Modules
</h2>



<div class="form">


<select id="moduleSubjectSelect"></select>


<select id="moduleTopicSelect"></select>



<input
id="moduleInput"
placeholder="Module name">


<button onclick="saveModule()">
Save Module
</button>


</div>



<div id="moduleList"></div>


</section>









<!-- TEST -->


<section id="tests"
class="section">


<h2>
Manage Tests
</h2>



<div class="form">


<select id="testSubjectSelect"></select>


<select id="testTopicSelect"></select>


<select id="testModuleSelect"></select>



<input
id="testInput"
placeholder="Test name">


<input
id="testDuration"
placeholder="Duration minutes"
type="number">



<button onclick="saveTest()">
Create Test
</button>


</div>



<div id="testList"></div>


</section>









<!-- MCQ -->

<section id="mcqs"
class="section">


<h2>
MCQ Manager
</h2>


<div class="form">


<select id="mcqTestSelect"></select>



<textarea
id="questionInput"
placeholder="Question">
</textarea>



<input id="option1"
placeholder="Option A">


<input id="option2"
placeholder="Option B">


<input id="option3"
placeholder="Option C">


<input id="option4"
placeholder="Option D">


<select id="answerSelect">

<option>
A
</option>

<option>
B
</option>

<option>
C
</option>

<option>
D
</option>

</select>



<button onclick="saveMCQ()">
Save Question
</button>


</div>



<div id="mcqList"></div>


</section>




</main>


</div>



<script src="app.js"></script>


</body>

</html>
