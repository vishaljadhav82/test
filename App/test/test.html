<script>
    // Config Keys
    const DB_KEY = "testSeriesDB";
    const RESULTS_DB_KEY = "testSeriesResultsDB";

    // -----------------------------------------------------------------
    // Optional: Firebase Realtime Database Config
    // Fill in your credentials below to enable cloud sync
    // -----------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "",
        authDomain: "",
        databaseURL: "",
        projectId: "",
        storageBucket: "",
        messagingSenderId: "",
        appId: ""
    };

    let isFirebaseEnabled = false;
    let dbRef = null;

    if (firebaseConfig.databaseURL) {
        try {
            firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database().ref();
            isFirebaseEnabled = true;
            console.log("Firebase sync enabled.");
        } catch (e) {
            console.error("Firebase initialization failed:", e);
        }
    }

    // Active state variables
    let currentActiveTest = null;
    let currentModuleQuestions = [];
    let currentCandidateName = "";
    let timerInterval = null;

    let selectedSubjectObj = null;
    let selectedTopicObj = null;
    let selectedModuleObj = null;

    // Database helper functions
    function getDB() {
        const db = localStorage.getItem(DB_KEY);
        if (!db) return { subjects: [] };
        try { return JSON.parse(db); } catch (e) { return { subjects: [] }; }
    }

    function saveDB(data) {
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        if (isFirebaseEnabled) {
            dbRef.child("testSeriesDB").set(data);
        }
    }

    function getResultsDB() {
        const results = localStorage.getItem(RESULTS_DB_KEY);
        if (!results) return [];
        try { return JSON.parse(results); } catch (e) { return []; }
    }

    function saveResultToDB(resultObject) {
        const results = getResultsDB();
        results.push(resultObject);
        localStorage.setItem(RESULTS_DB_KEY, JSON.stringify(results));
        if (isFirebaseEnabled) {
            dbRef.child("testSeriesResults").push(resultObject);
        }
    }

    // Modal Control
    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

    // Initialization & UI Logic
    function initSelectionScreen() {
        const db = getDB();
        const subjectSelect = document.getElementById("subjectSelect");
        
        document.getElementById("userFullName").value = "";
        subjectSelect.innerHTML = `<option value="">-- Select Subject --</option>`;
        document.getElementById("topicSelect").innerHTML = `<option value="">-- Select Topic --</option>`;
        document.getElementById("moduleSelect").innerHTML = `<option value="">-- Select Module --</option>`;
        document.getElementById("testSelect").innerHTML = `<option value="">-- Select Test --</option>`;
        
        document.getElementById("topicSelect").disabled = true;
        document.getElementById("moduleSelect").disabled = true;
        document.getElementById("testSelect").disabled = true;
        document.getElementById("startTestBtn").disabled = true;

        selectedSubjectObj = null;
        selectedTopicObj = null;
        selectedModuleObj = null;

        if (db.subjects && Array.isArray(db.subjects)) {
            db.subjects.forEach(subject => {
                const option = document.createElement("option");
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });
        }

        handleDeepLinks();
    }

    function checkFormValidity() {
        const fullName = document.getElementById("userFullName").value.trim();
        const testSelectVal = document.getElementById("testSelect").value;
        document.getElementById("startTestBtn").disabled = !(fullName.length > 0 && testSelectVal !== "");
    }

    function onSubjectChange() {
        const subjectId = Number(document.getElementById("subjectSelect").value);
        const topicSelect = document.getElementById("topicSelect");
        
        topicSelect.innerHTML = `<option value="">-- Select Topic --</option>`;
        document.getElementById("moduleSelect").innerHTML = `<option value="">-- Select Module --</option>`;
        document.getElementById("testSelect").innerHTML = `<option value="">-- Select Test --</option>`;
        
        document.getElementById("moduleSelect").disabled = true;
        document.getElementById("testSelect").disabled = true;
        checkFormValidity();

        selectedSubjectObj = null;
        selectedTopicObj = null;
        selectedModuleObj = null;

        if (!subjectId) { topicSelect.disabled = true; return; }

        const db = getDB();
        selectedSubjectObj = db.subjects.find(s => s.id === subjectId);

        if (selectedSubjectObj && selectedSubjectObj.topics) {
            selectedSubjectObj.topics.forEach(topic => {
                const option = document.createElement("option");
                option.value = topic.id;
                option.textContent = topic.name;
                topicSelect.appendChild(option);
            });
            topicSelect.disabled = false;
        }
    }

    function onTopicChange() {
        const topicId = Number(document.getElementById("topicSelect").value);
        const moduleSelect = document.getElementById("moduleSelect");

        moduleSelect.innerHTML = `<option value="">-- Select Module --</option>`;
        document.getElementById("testSelect").innerHTML = `<option value="">-- Select Test --</option>`;
        document.getElementById("testSelect").disabled = true;
        checkFormValidity();

        selectedTopicObj = null;
        selectedModuleObj = null;

        if (!topicId) { moduleSelect.disabled = true; return; }

        selectedTopicObj = selectedSubjectObj ? selectedSubjectObj.topics.find(t => t.id === topicId) : null;

        if (selectedTopicObj && selectedTopicObj.modules) {
            selectedTopicObj.modules.forEach(module => {
                const option = document.createElement("option");
                option.value = module.id;
                option.textContent = module.name;
                moduleSelect.appendChild(option);
            });
            moduleSelect.disabled = false;
        }
    }

    function onModuleChange() {
        const moduleId = Number(document.getElementById("moduleSelect").value);
        const testSelect = document.getElementById("testSelect");

        testSelect.innerHTML = `<option value="">-- Select Test --</option>`;
        checkFormValidity();

        selectedModuleObj = null;

        if (!moduleId) { testSelect.disabled = true; return; }

        selectedModuleObj = selectedTopicObj ? selectedTopicObj.modules.find(m => m.id === moduleId) : null;

        if (selectedModuleObj && selectedModuleObj.tests) {
            selectedModuleObj.tests.forEach(test => {
                const option = document.createElement("option");
                option.value = test.id;
                option.textContent = test.name || test.title || "Untitled Test";
                testSelect.appendChild(option);
            });
            testSelect.disabled = false;
        }
    }

    // Deep Linking Support
    function handleDeepLinks() {
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = Number(urlParams.get("subjectId"));
        const topicId = Number(urlParams.get("topicId"));
        const moduleId = Number(urlParams.get("moduleId"));
        const testId = Number(urlParams.get("testId"));

        if (!subjectId) return;

        const subjectSelect = document.getElementById("subjectSelect");
        subjectSelect.value = subjectId;
        onSubjectChange();

        if (topicId) {
            const topicSelect = document.getElementById("topicSelect");
            topicSelect.value = topicId;
            onTopicChange();
        }

        if (moduleId) {
            const moduleSelect = document.getElementById("moduleSelect");
            moduleSelect.value = moduleId;
            onModuleChange();
        }

        if (testId) {
            const testSelect = document.getElementById("testSelect");
            testSelect.value = testId;
            checkFormValidity();
            document.getElementById("shareBanner").classList.remove("hidden");
        }
    }

    function copyDirectLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert("Direct link copied to clipboard!");
        });
    }

    // Core Test Logic
    function startTest() {
        const fullNameInput = document.getElementById("userFullName").value.trim();
        const testId = Number(document.getElementById("testSelect").value);

        if (!fullNameInput || !testId) return;

        currentCandidateName = fullNameInput;
        const foundTest = selectedModuleObj && selectedModuleObj.tests ? selectedModuleObj.tests.find(t => t.id === testId) : null;

        if (!foundTest) {
            alert("Test could not be found.");
            return;
        }

        currentActiveTest = foundTest;
        currentModuleQuestions = selectedModuleObj.questions || [];

        document.getElementById("selectionScreen").classList.add("hidden");
        document.getElementById("testScreen").classList.remove("hidden");

        document.getElementById("activeTestTitle").textContent = foundTest.name || foundTest.title || "Test";
        document.getElementById("candidateNameDisplay").textContent = `Candidate: ${currentCandidateName}`;

        renderQuestions();
        startTimer((foundTest.duration || 15) * 60);
    }

    function renderQuestions() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";

        let testQuestions = [];
        if (currentActiveTest.questionIds && currentActiveTest.questionIds.length > 0) {
            testQuestions = currentModuleQuestions.filter(q => currentActiveTest.questionIds.includes(q.id));
        } else {
            testQuestions = currentModuleQuestions;
        }

        if (testQuestions.length === 0) {
            container.innerHTML = `<p>No questions found associated with this test.</p>`;
            return;
        }

        testQuestions.forEach((q, index) => {
            const block = document.createElement("div");
            block.className = "question-block";
            
            let optionsHtml = "";
            if (q.options) {
                for (const [key, value] of Object.entries(q.options)) {
                    optionsHtml += `
                        <label class="option-label">
                            <input type="radio" name="question_${q.id}" value="${key}" required>
                            <strong>${key}.</strong> ${value}
                        </label>
                    `;
                }
            }

            block.innerHTML = `
                <div class="question-title">Q${index + 1}. ${q.question}</div>
                <div>${optionsHtml}</div>
            `;
            container.appendChild(block);
        });
    }

    function startTimer(durationInSeconds) {
        let timer = durationInSeconds;
        const display = document.getElementById("timerDisplay");

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = `Time Left: ${minutes}:${seconds}`;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert("Time's up! Submitting your test automatically.");
                document.getElementById("testForm").requestSubmit();
            }
        }, 1000);
    }

    function submitTest(event) {
        event.preventDefault();
        clearInterval(timerInterval);

        let testQuestions = [];
        if (currentActiveTest.questionIds && currentActiveTest.questionIds.length > 0) {
            testQuestions = currentModuleQuestions.filter(q => currentActiveTest.questionIds.includes(q.id));
        } else {
            testQuestions = currentModuleQuestions;
        }

        let score = 0;
        const total = testQuestions.length;
        const detailedQuestions = [];

        testQuestions.forEach(q => {
            const selectedOption = document.querySelector(`input[name="question_${q.id}"]:checked`);
            const selectedAnswerKey = selectedOption ? selectedOption.value : null;
            const isCorrect = selectedAnswerKey === q.answer;

            if (isCorrect) score++;

            detailedQuestions.push({
                questionId: q.id,
                questionText: q.question,
                options: q.options,
                correctAnswer: q.answer,
                selectedAnswer: selectedAnswerKey,
                isCorrect: isCorrect
            });
        });

        const testResultRecord = {
            resultId: Date.now(),
            candidateName: currentCandidateName,
            subjectId: selectedSubjectObj ? selectedSubjectObj.id : null,
            subjectName: selectedSubjectObj ? selectedSubjectObj.name : "Unknown Subject",
            topicId: selectedTopicObj ? selectedTopicObj.id : null,
            topicName: selectedTopicObj ? selectedTopicObj.name : "Unknown Topic",
            moduleId: selectedModuleObj ? selectedModuleObj.id : null,
            moduleName: selectedModuleObj ? selectedModuleObj.name : "Unknown Module",
            testId: currentActiveTest.id,
            testName: currentActiveTest.name || currentActiveTest.title || "Untitled Test",
            submittedAt: new Date().toISOString(),
            score: score,
            totalQuestions: total,
            percentage: ((score / total) * 100).toFixed(2),
            detailedQuestions: detailedQuestions
        };

        saveResultToDB(testResultRecord);

        document.getElementById("testScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.remove("hidden");

        document.getElementById("resultCandidateName").textContent = `Candidate: ${currentCandidateName}`;
        document.getElementById("scoreDisplay").textContent = `${score} / ${total}`;
        document.getElementById("resultFeedback").textContent = score === total ? "Excellent work! Perfect score." : "Good effort! Review your answers below.";

        renderDetailedReview(detailedQuestions);
    }

    function renderDetailedReview(detailedQuestions) {
        const reviewContainer = document.getElementById("detailedReviewContainer");
        reviewContainer.innerHTML = "<h3>Detailed Question Breakdown:</h3>";

        detailedQuestions.forEach((item, index) => {
            const reviewDiv = document.createElement("div");
            reviewDiv.className = `review-item ${item.isCorrect ? 'correct' : 'incorrect'}`;

            const selectedText = item.selectedAnswer ? `${item.selectedAnswer}. ${item.options[item.selectedAnswer]}` : "None Selected";
            const correctText = `${item.correctAnswer}. ${item.options[item.correctAnswer]}`;

            reviewDiv.innerHTML = `
                <p><strong>Q${index + 1}:</strong> ${item.questionText}</p>
                <p style="margin: 4px 0;"><strong>Your Answer:</strong> <span style="color: ${item.isCorrect ? 'var(--success-color)' : 'var(--danger-color)'};">${selectedText}</span></p>
                <p style="margin: 4px 0;"><strong>Correct Answer:</strong> <span style="color: var(--success-color);">${correctText}</span></p>
            `;
            reviewContainer.appendChild(reviewDiv);
        });
    }

    function resetToSelection() {
        document.getElementById("resultScreen").classList.add("hidden");
        document.getElementById("selectionScreen").classList.remove("hidden");
        initSelectionScreen();
    }

    // -----------------------------------------------------------------
    // Cryptographic Backup & Restore (Web Crypto API - AES-GCM)
    // -----------------------------------------------------------------
    async function getKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function exportEncryptedBackup() {
        const password = document.getElementById("backupPassword").value;
        if (!password) { alert("Please enter a password for encryption."); return; }

        const payload = JSON.stringify({
            testSeriesDB: getDB(),
            testSeriesResultsDB: getResultsDB()
        });

        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await getKey(password, salt);

        const encryptedContent = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(payload));

        const backupData = {
            salt: Array.from(salt),
            iv: Array.from(iv),
            cipherText: Array.from(new Uint8Array(encryptedContent))
        };

        const blob = new Blob([JSON.stringify(backupData)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `test_series_backup_${Date.now()}.json`;
        a.click();
        closeModal("backupModal");
    }

    async function importEncryptedBackup() {
        const password = document.getElementById("backupPassword").value;
        const fileInput = document.getElementById("restoreFileSelect");

        if (!password || fileInput.files.length === 0) {
            alert("Provide both password and backup file.");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                const backupData = JSON.parse(e.target.result);
                const salt = new Uint8Array(backupData.salt);
                const iv = new Uint8Array(backupData.iv);
                const cipherText = new Uint8Array(backupData.cipherText);

                const key = await getKey(password, salt);
                const decryptedContent = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipherText);

                const dec = new TextDecoder();
                const restoredObj = JSON.parse(dec.decode(decryptedContent));

                if (restoredObj.testSeriesDB) saveDB(restoredObj.testSeriesDB);
                if (restoredObj.testSeriesResultsDB) localStorage.setItem(RESULTS_DB_KEY, JSON.stringify(restoredObj.testSeriesResultsDB));

                alert("Data restored successfully!");
                closeModal("backupModal");
                initSelectionScreen();
            } catch (err) {
                alert("Decryption failed! Invalid password or corrupted backup.");
            }
        };

        reader.readAsText(file);
    }

    window.onload = initSelectionScreen;
</script>

    firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

// ==========================
// Configuration
// ==========================
const RESULTS_DB_KEY = "testSeriesResultsDB";
const USER_ID = "default_user";

// Optional status callback
function updateStatus(message) {
    console.log(message);
}

// ==========================
// Backup Results DB
// ==========================
async function backupResultsDB() {
    try {
        const localData = localStorage.getItem(RESULTS_DB_KEY);

        if (!localData) {
            updateStatus("No Results DB found.");
            return false;
        }

        const parsedData = JSON.parse(localData);

        const docRef = db.collection("backups").doc(USER_ID);
        const snap = await docRef.get();

        const existingData = snap.exists ? snap.data() : {};

        existingData[RESULTS_DB_KEY] = parsedData;
        existingData.lastUpdated =
            firebase.firestore.FieldValue.serverTimestamp();

        await docRef.set(existingData);

        updateStatus("Results DB backup successful.");
        return true;

    } catch (err) {
        console.error(err);
        updateStatus("Backup failed.");
        return false;
    }
}

// ==========================
// Restore Results DB
// ==========================
async function restoreResultsDB() {
    try {
        const snap = await db.collection("backups").doc(USER_ID).get();

        if (!snap.exists) {
            updateStatus("No backup found.");
            return false;
        }

        const data = snap.data();

        if (!data[RESULTS_DB_KEY]) {
            updateStatus("Results DB not found in cloud.");
            return false;
        }

        localStorage.setItem(
            RESULTS_DB_KEY,
            JSON.stringify(data[RESULTS_DB_KEY])
        );

        updateStatus("Results DB restored successfully.");
        return true;

    } catch (err) {
        console.error(err);
        updateStatus("Restore failed.");
        return false;
    }
}
