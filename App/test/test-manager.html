<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Manager</title>
    <link re="stylesheet" href="test_manager.css">
    <style>/* ==========================================
   VARIABLES
========================================== */

:root{
    --sidebar-width:260px;

    --primary:#4f46e5;
    --primary-hover:#4338ca;

    --bg:#f3f4f6;
    --card:#ffffff;

    --text:#1f2937;

    --border:#e5e7eb;

    --danger:#ef4444;

    --sidebar:#111827;

    --sidebar-hover:#1f2937;

    --sidebar-active:#4f46e5;

    --shadow:0 8px 20px rgba(0,0,0,.08);

    --radius:10px;
}

/* ==========================================
RESET
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
    "Segoe UI",
    sans-serif;

    background:var(--bg);

    color:var(--text);

}

/* ==========================================
APP
========================================== */

.app{

    display:flex;

    min-height:100vh;

}

/* ==========================================
SIDEBAR
========================================== */

.sidebar{

    position:fixed;

    top:0;

    left:-270px;

    width:260px;

    height:100vh;

    background:var(--sidebar);

    color:white;

    transition:.35s;

    overflow-y:auto;

    z-index:1000;

    box-shadow:var(--shadow);

}

.sidebar.show{

    left:0;

}

.sidebar-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px;

    border-bottom:1px solid rgba(255,255,255,.1);

}

.sidebar-header h2{

    font-size:22px;

}

.close-btn{

    background:none;

    border:none;

    color:white;

    font-size:24px;

    cursor:pointer;

}

/* ==========================================
NAVIGATION
========================================== */

.sidebar-nav{

    padding:15px 0;

}

.sidebar-nav a{

    display:block;

    color:#d1d5db;

    text-decoration:none;

    padding:14px 22px;

    transition:.25s;

    font-size:15px;

}

.sidebar-nav a:hover{

    background:var(--sidebar-hover);

    color:white;

    padding-left:30px;

}

.sidebar-nav a.active{

    background:var(--sidebar-active);

    color:white;

}

.sidebar hr{

    border:none;

    border-top:1px solid rgba(255,255,255,.1);

    margin:10px 0;

}

/* ==========================================
OVERLAY
========================================== */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.5);

    display:none;

    z-index:999;

}

.overlay.show{

    display:block;

}

/* ==========================================
CONTENT
========================================== */

.main-content{

    width:100%;

    padding:15px;

}

/* ==========================================
TOPBAR
========================================== */

.topbar{

    background:white;

    border-radius:var(--radius);

    padding:15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    box-shadow:var(--shadow);

}

.topbar h1{

    font-size:24px;

}

.menu-btn{

    background:var(--primary);

    color:white;

    border:none;

    padding:10px 14px;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

}

/* ==========================================
CARDS
========================================== */

.card{

    background:var(--card);

    border-radius:var(--radius);

    padding:20px;

    margin-bottom:20px;

    box-shadow:var(--shadow);

}

.card h2{

    margin-bottom:18px;

}

/* ==========================================
FORMS
========================================== */

.form-grid{

    display:grid;

    grid-template-columns:1fr;

    gap:15px;

    margin-bottom:20px;

}

.form-group{

    display:flex;

    flex-direction:column;

}

label{

    font-weight:600;

    margin-bottom:6px;

}

input,
select{

    width:100%;

    padding:12px;

    border:1px solid var(--border);

    border-radius:8px;

    outline:none;

    font-size:15px;

}

input:focus,
select:focus{

    border-color:var(--primary);

}

/* ==========================================
BUTTONS
========================================== */

.btn{

    background:var(--primary);

    color:white;

    border:none;

    border-radius:8px;

    padding:12px 18px;

    cursor:pointer;

    font-weight:600;

    transition:.3s;

}

.btn:hover{

    background:var(--primary-hover);

}

.btn-danger{

    background:var(--danger);

}

/* ==========================================
TABLE
========================================== */

.table-responsive{

    overflow-x:auto;

}

table{

    width:100%;

    min-width:750px;

    border-collapse:collapse;

}

th{

    background:#f9fafb;

    font-weight:700;

}

th,
td{

    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:left;

}

tbody tr:hover{

    background:#f8fafc;

}

.badge{

    display:inline-block;

    padding:5px 10px;

    background:#e0e7ff;

    color:#3730a3;

    border-radius:20px;

    font-size:13px;

}

.actions-cell{

    display:flex;

    gap:8px;

}

/* ==========================================
SCROLLBAR
========================================== */

::-webkit-scrollbar{

    width:8px;

    height:8px;

}

::-webkit-scrollbar-thumb{

    background:#9ca3af;

    border-radius:20px;

}

::-webkit-scrollbar-track{

    background:#ececec;

}

/* ==========================================
TABLET
========================================== */

@media(min-width:768px){

.form-grid{

grid-template-columns:
repeat(2,1fr);

}

}

/* ==========================================
DESKTOP
========================================== */

@media(min-width:992px){

.sidebar{

left:0;

}

.close-btn{

display:none;

}

.overlay{

display:none!important;

}

.main-content{

margin-left:260px;

padding:30px;

}

.menu-btn{

display:none;

}

.form-grid{

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

}

}
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h2>Test Portal</h2>
            <button class="close-btn" onclick="closeSidebar()">✕</button>
        </div>

        <nav class="sidebar-nav">

            <a href="builder.html">🏗 Test Builder</a>

            <a href="master-test.html">📝 Master Test</a>

            <a href="test.html">▶ Take Test</a>

            <a href="result.html">📊 Results</a>

            <a href="test-manager.html" class="active">
                📁 Test Manager
            </a>

            <hr>

            <a href="../topic/index.html">
                📚 Topics
            </a>

            <a href="../module/index.html">
                📂 Modules
            </a>

            <a href="../question/index.html">
                ❓ Questions
            </a>

            <a href="../question/analytics.html">
                📈 Analytics
            </a>

            <a href="../admin/admin.html">
                ⚙ Admin
            </a>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="topbar">

            <button class="menu-btn"
                    onclick="toggleSidebar()">
                ☰
            </button>

            <h1>Tests Manager</h1>

            <button class="btn"
                    onclick="initApp()">
                Refresh
            </button>

        </header>

        <!-- Add Test Card -->

        <div class="card">

            <h2>Add New Test</h2>

            <form id="addTestForm"
                  onsubmit="handleAddNewTest(event)">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Select Module</label>

                        <select id="moduleSelect" required>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Test Name</label>

                        <input
                                id="testTitle"
                                type="text"
                                placeholder="Test Name"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Duration</label>

                        <input
                                id="testDuration"
                                type="number"
                                value="15"
                                min="1">

                    </div>

                    <div class="form-group">

                        <label>Difficulty</label>

                        <select id="testDifficulty">

                            <option>Easy</option>

                            <option>Medium</option>

                            <option>Hard</option>

                            <option selected>Mixed</option>

                        </select>

                    </div>

                </div>

                <button class="btn">
                    Create Test
                </button>

            </form>

        </div>

        <!-- Existing Tests -->

        <div class="card">

            <h2>Existing Tests</h2>

            <div class="table-responsive">

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Module</th>

                        <th>Duration</th>

                        <th>Difficulty</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody id="testsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>
<script>
// ===========================================
// SIDEBAR
// ===========================================

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleSidebar() {

    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");

}

function closeSidebar() {

    sidebar.classList.remove("show");
    overlay.classList.remove("show");

}

// Close sidebar when a menu item is clicked (Mobile)

document.querySelectorAll(".sidebar-nav a").forEach(link => {

    link.addEventListener("click", () => {

        if(window.innerWidth < 992){

            closeSidebar();

        }

    });

});

// ESC key closes sidebar

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        closeSidebar();

    }

});

// Resize handling

window.addEventListener("resize",()=>{

    if(window.innerWidth>=992){

        overlay.classList.remove("show");

        sidebar.classList.remove("show");

    }

});

// Prevent body scrolling when sidebar is open

const observer = new MutationObserver(() => {

    if(sidebar.classList.contains("show")){

        document.body.style.overflow="hidden";

    }else{

        document.body.style.overflow="auto";

    }

});

observer.observe(sidebar,{
    attributes:true,
    attributeFilter:["class"]
});

</script>


<script>
    const DB_KEY = "testSeriesDB";

    function getDB() {
        const db = localStorage.getItem(DB_KEY);
        if (!db) {
            console.warn(`No data found in localStorage under key: "${DB_KEY}"`);
            return { subjects: [] };
        }
        try {
            return JSON.parse(db);
        } catch (error) {
            console.error("Error parsing JSON from localStorage:", error);
            return { subjects: [] };
        }
    }

    function saveDB(data) {
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        initApp();
    }

    function initApp() {
        const db = getDB();
        const moduleSelect = document.getElementById("moduleSelect");
        const testsTableBody = document.getElementById("testsTableBody");

        moduleSelect.innerHTML = "";
        testsTableBody.innerHTML = "";

        let allTestsCount = 0;

        if (db.subjects && Array.isArray(db.subjects)) {
            db.subjects.forEach(subject => {
                if (subject.topics && Array.isArray(subject.topics)) {
                    subject.topics.forEach(topic => {
                        if (topic.modules && Array.isArray(topic.modules)) {
                            topic.modules.forEach(module => {
                                const optionElem = document.createElement("option");
                                optionElem.value = `${subject.id}_${topic.id}_${module.id}`;
                                optionElem.textContent = `${subject.name} > ${topic.name} > ${module.name}`;
                                moduleSelect.appendChild(optionElem);

                                if (module.tests && Array.isArray(module.tests)) {
                                    module.tests.forEach(test => {
                                        allTestsCount++;
                                        const tr = document.createElement("tr");
                                        
                                        const testName = test.name || test.title || "Untitled Test";
                                        const testStatus = test.status || "Active";
                                        const testDifficulty = test.difficulty || "Mixed";

                                        tr.innerHTML = `
                                            <td>${test.id}</td>
                                            <td><strong>${testName}</strong></td>
                                            <td><span class="badge">${module.name}</span></td>
                                            <td>${test.duration} mins</td>
                                            <td>${testDifficulty}</td>
                                            <td>${testStatus}</td>
                                            <td class="actions-cell">
                                                <button class="btn btn-danger" onclick="deleteTest(${subject.id}, ${topic.id}, ${module.id}, ${test.id})">Delete</button>
                                            </td>
                                        `;
                                        testsTableBody.appendChild(tr);
                                    });
                                }
                            });
                        }
                    });
                }
            });
        }

        if (allTestsCount === 0) {
            testsTableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #6b7280;">No tests found in local storage. Create one above!</td></tr>`;
        }
    }

    function handleAddNewTest(event) {
        event.preventDefault();
        
        const selectionPath = document.getElementById("moduleSelect").value;
        if (!selectionPath) {
            alert("Please select a valid module first!");
            return;
        }

        const [subjId, topicId, modId] = selectionPath.split("_").map(Number);
        
        const title = document.getElementById("testTitle").value.trim();
        const duration = parseInt(document.getElementById("testDuration").value);
        const difficulty = document.getElementById("testDifficulty").value;

        const db = getDB();

        let updated = false;
        db.subjects.forEach(subject => {
            if (subject.id === subjId) {
                subject.topics.forEach(topic => {
                    if (topic.id === topicId) {
                        topic.modules.forEach(module => {
                            if (module.id === modId) {
                                if (!module.tests) module.tests = [];
                                
                                const sampleQuestionIds = module.questions && module.questions.length > 0 
                                    ? module.questions.slice(0, 3).map(q => q.id) 
                                    : [];

                                const newTest = {
                                    id: Date.now(),
                                    name: title,
                                    title: title,
                                    duration: duration,
                                    marks: 0,
                                    negative: 0,
                                    difficulty: difficulty,
                                    status: "Active",
                                    questionIds: sampleQuestionIds
                                };

                                module.tests.push(newTest);
                                updated = true;
                            }
                        });
                    }
                });
            }
        });

        if (updated) {
            saveDB(db);
            document.getElementById("addTestForm").reset();
            alert("Test added successfully!");
        } else {
            alert("Could not locate the specified module in database.");
        }
    }

    function deleteTest(subjId, topicId, modId, testId) {
        if (!confirm("Are you sure you want to delete this test?")) return;

        const db = getDB();

        db.subjects.forEach(subject => {
            if (subject.id === subjId) {
                subject.topics.forEach(topic => {
                    if (topic.id === topicId) {
                        topic.modules.forEach(module => {
                            if (module.id === modId && module.tests) {
                                module.tests = module.tests.filter(t => t.id !== testId);
                            }
                        });
                    }
                });
            }
        });

        saveDB(db);
    }

    window.onload = initApp;
</script>
</html>
